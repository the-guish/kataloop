[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "kataloop"
dynamic = ["version"]
description = "A small agent loop over uni-llm-client, with MCP tool servers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "AUTHORS"]
authors = [{ name = "The kataloop Authors" }]
maintainers = [{ name = "Luis Castro", email = "dev@guish.in" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # The HTTP client McpToolbox hands mcp 2; mcp 2 and uni-llm-client are
    # built on it too. On mcp 1 the toolbox hands it httpx, which mcp 1 brings.
    "httpx2>=2.16",
    "kataloop-core",
    # The MCP SDK (MIT), for McpToolbox (docs/specs/tools.md): either major,
    # whichever the environment holds (TOOLS-8). The extras narrow it to one.
    "mcp>=1.30,<3",
]

[project.optional-dependencies]
# McpToolbox on mcp 1, beside a library that needs it, or on mcp 2.
mcp-1 = ["mcp>=1.30,<2"]
mcp-2 = ["mcp>=2.3,<3"]
# More extras come with their features (docs/plan.md): `postgres` for the
# store over asyncpg.

[project.urls]
Homepage = "https://github.com/the-guish/kataloop"
Issues = "https://github.com/the-guish/kataloop/issues"
Changelog = "https://github.com/the-guish/kataloop/blob/main/CHANGELOG.md"

# One environment holds one mcp: uv resolves each extra on its own, both in the
# workspace's one lock file.
[tool.uv]
conflicts = [[{ extra = "mcp-1" }, { extra = "mcp-2" }]]

[tool.hatch.version]
source = "vcs"
# The git repository is three levels up, at the root of every port.
raw-options = { root = "../../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/kataloop"]
