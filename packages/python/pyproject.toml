# The uv workspace of the Python port: two packages, one lock file, one set of
# checks. The root is virtual: it is no package itself.
[project]
name = "kataloop-workspace"
version = "0"
requires-python = ">=3.12"
# Both members, so that a plain `uv sync` installs them with uni-llm-client.
dependencies = ["kataloop", "kataloop-core"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["kataloop-core", "kataloop"]

[tool.uv.sources]
kataloop = { workspace = true }
kataloop-core = { workspace = true }
# A git dependency until uni-llm-client is released; the commit is the tip of
# its branch with the features the loop needs. Move to a version then.
uni-llm-client = { git = "https://github.com/the-guish/uni-llm-client", rev = "351c55f9a2da6e7826d54e0394d72a1d58dba72c", subdirectory = "packages/python" }

[dependency-groups]
dev = [
    "mypy>=2",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["kataloop-core/src", "kataloop/src"]
