[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "kataloop-core"
dynamic = ["version"]
description = "A small agent loop over uni-llm-client: the contract, the loop, memory in the process"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "AUTHORS"]
authors = [{ name = "The kataloop Authors" }]
maintainers = [{ name = "Luis Castro", email = "dev@guish.in" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# No version bound while uni-llm-client comes from git (packages/python/pyproject.toml).
dependencies = [
    "uni-llm-client",
]

[project.urls]
Homepage = "https://github.com/the-guish/kataloop"
Issues = "https://github.com/the-guish/kataloop/issues"
Changelog = "https://github.com/the-guish/kataloop/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"
# The git repository is three levels up, at the root of every port.
raw-options = { root = "../../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/kataloop_core"]
