[project]
name = "kataloop-contract-tests"
version = "0"
description = "Language-agnostic tests that every kataloop port must pass"
requires-python = ">=3.12"
# The mock MCP server is the MCP SDK's own server, served by uvicorn.
dependencies = [
    "mcp>=2.3,<3",
    "uvicorn>=0.31",
]

[dependency-groups]
dev = [
    "mypy>=2",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["."]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true
