name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Each package runs its checks only when it changes. A change to the shared tests
# runs the HTTP tests of every package. A change to this workflow runs
# everything.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.ci == 'true' }}
      python-http: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.ci == 'true' }}
      typescript: ${{ steps.filter.outputs.typescript == 'true' || steps.filter.outputs.ci == 'true' }}
      shared: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci:
              - .github/workflows/ci.yml
            shared:
              - tests/**
            python:
              - packages/python/**
            typescript:
              - packages/typescript/**

  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # uni-llm-client is a git dependency until it is released, so it is built
      # from source here; `--no-build` returns with its first release.
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      # Each package ships copies of the root license files.
      - run: |
          for p in kataloop-core kataloop; do
            for f in LICENSE NOTICE AUTHORS; do cmp "$p/$f" "../../$f"; done
          done

  python-build:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the package versions from the git tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build --package kataloop-core
      - run: uv build --package kataloop

  # The language-agnostic tests against the Python test server. Their coverage of
  # both packages is the only coverage reported for them.
  python-http:
    needs: changes
    if: needs.changes.outputs.python-http == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      # The test server's environment, built before the runner starts it.
      - working-directory: packages/python
        run: uv sync --locked
      - run: uv run --locked pytest --package python
      - working-directory: packages/python
        run: |
          uv run --locked coverage combine
          uv run --locked coverage xml
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: packages/python/coverage.xml

  shared-lint:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked mypy

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  # The one check to require: it passes when every job passed or was skipped.
  ci-ok:
    if: always()
    needs:
      - changes
      - python-lint
      - python-build
      - python-http
      - shared-lint
      - typescript
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
